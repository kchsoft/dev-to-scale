name: APM Path Divergence Diagnostic

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout watch policy
        uses: actions/checkout@v4
        with:
          path: watch
      - name: Checkout 85 percent baseline
        uses: actions/checkout@v4
        with:
          ref: 161af3532aaa1a082536f77b13b1118d729372e3
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          (cd watch && npm install)
          (cd baseline && npm install)
      - name: Run targeted APM traces
        run: |
          set -euo pipefail
          mkdir -p traces
          scenarios=(
            'ASPNET_CORE MONGODB 23'
            'NESTJS MONGODB 10'
            'FASTAPI POSTGRESQL 23'
            'SPRING_BOOT MONGODB 21'
            'ASPNET_CORE POSTGRESQL 10'
          )
          for scenario in "${scenarios[@]}"; do
            read -r framework database seed <<< "$scenario"
            key="${framework}-${database}-${seed}"
            for policy in baseline watch; do
              (cd "$policy" && npm run balance -- --framework "$framework" --db "$database" --seed "$seed" --strategy APM_AWARE --trace) \
                > "traces/${policy}-${key}.log"
            done
          done
      - name: Analyze first divergence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const scenarios = [
            ['ASPNET_CORE', 'MONGODB', 23],
            ['NESTJS', 'MONGODB', 10],
            ['FASTAPI', 'POSTGRESQL', 23],
            ['SPRING_BOOT', 'MONGODB', 21],
            ['ASPNET_CORE', 'POSTGRESQL', 10],
          ];

          function parseTrace(path) {
            return fs.readFileSync(path, 'utf8').split('\n')
              .filter(line => line.startsWith('[trace] '))
              .map(line => JSON.parse(line.slice(8)));
          }
          function parseRun(path) {
            const line = fs.readFileSync(path, 'utf8').split('\n').find(line => line.startsWith('[balance] terminal '));
            return line ?? null;
          }
          function isStability(entry) {
            return entry?.actionReason?.startsWith('stabilize live APM diagnosis')
              || entry?.actionReason?.startsWith('stabilize live DATABASE')
              || entry?.actionReason?.startsWith('stabilize live SERVER_GROUP');
          }

          const report = {};
          for (const [framework, database, seed] of scenarios) {
            const key = `${framework}-${database}-${seed}`;
            const baselinePath = `traces/baseline-${key}.log`;
            const watchPath = `traces/watch-${key}.log`;
            const baseline = parseTrace(baselinePath);
            const watch = parseTrace(watchPath);
            const baselineByDay = new Map(baseline.map(entry => [entry.day, entry]));
            const watchByDay = new Map(watch.map(entry => [entry.day, entry]));
            const commonDays = [...baselineByDay.keys()].filter(day => watchByDay.has(day)).sort((a,b) => a-b);
            const firstDivergenceDay = commonDays.find(day => {
              const left = baselineByDay.get(day);
              const right = watchByDay.get(day);
              return left.actionId !== right.actionId || left.viralControl !== right.viralControl || left.incidentControl !== right.incidentControl;
            }) ?? null;
            const firstSignalDivergenceDay = commonDays.find(day => baselineByDay.get(day).hottestVisibleSignal !== watchByDay.get(day).hottestVisibleSignal) ?? null;
            const stability = watch.filter(isStability);
            const stabilityComparisons = stability.slice(0, 20).map(entry => ({
              day: entry.day,
              watch: entry,
              baselineSameDay: baselineByDay.get(entry.day) ?? null,
            }));
            const around = firstDivergenceDay === null ? [] : commonDays
              .filter(day => day >= firstDivergenceDay - 4 && day <= firstDivergenceDay + 8)
              .map(day => ({ day, baseline: baselineByDay.get(day), watch: watchByDay.get(day) }));
            report[key] = {
              baselineDays: baseline.length,
              watchDays: watch.length,
              baselineTerminal: parseRun(baselinePath),
              watchTerminal: parseRun(watchPath),
              firstDivergenceDay,
              firstSignalDivergenceDay,
              firstWatchStabilityDay: stability[0]?.day ?? null,
              stabilityActionCount: stability.length,
              stabilityComparisons,
              aroundFirstDivergence: around,
            };
          }
          fs.writeFileSync('traces/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: apm-path-divergence-diagnostic
          path: traces/
          if-no-files-found: error
