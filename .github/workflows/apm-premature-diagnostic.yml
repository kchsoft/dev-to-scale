name: APM Premature Capacity Diagnostic

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout watch policy
        uses: actions/checkout@v4
        with:
          path: watch
      - name: Checkout restored 85 percent baseline
        uses: actions/checkout@v4
        with:
          ref: 161af3532aaa1a082536f77b13b1118d729372e3
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          (cd watch && npm install)
          (cd baseline && npm install)
      - name: Inject diagnostic logging
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const root of ['watch', 'baseline']) {
            const path = `${root}/src/simulation/simulation-runner.ts`;
            let source = fs.readFileSync(path, 'utf8');
            const needle = '      const preActionRatio = targetEffectiveRatio(engine, action);\n';
            if (!source.includes(needle)) throw new Error(`${root}: diagnostic injection point not found`);
            source = source.replace(needle, needle + `      if ((action.type === 'RESIZE_NODE' || action.type === 'SCALE_OUT_NODE')\n        && (preActionRatio ?? 0) < 0.70\n        && refreshed.growthEvent?.type !== 'VIRAL') {\n        console.log('[premature-debug] ' + JSON.stringify({\n          day: engine.day,\n          actionId: simulationActionId(action),\n          actionReason: action.reason,\n          actionIntent: action.intent ?? null,\n          preActionRatio: preActionRatio ?? 0,\n          hottestVisibleSignal: visibleSignal(refreshed),\n          completedFeatureCount: engine.snapshot.completedFeatures.length,\n        }));\n      }\n`);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Run affected-strategy diagnostic matrix
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          frameworks=(SPRING_BOOT NESTJS FASTAPI GIN ASPNET_CORE)
          databases=(MYSQL POSTGRESQL MONGODB)
          seeds=(5 8 17 23 29)
          for policy in baseline watch; do
            : > "diagnostics/${policy}.log"
            for framework in "${frameworks[@]}"; do
              for database in "${databases[@]}"; do
                for seed in "${seeds[@]}"; do
                  echo "[scenario] ${framework}|${database}|${seed}" >> "diagnostics/${policy}.log"
                  (cd "$policy" && npm run balance -- --framework "$framework" --db "$database" --seed "$seed" --strategy APM_AWARE) \
                    | grep -E '^\[premature-debug\]' >> "diagnostics/${policy}.log" || true
                done
              done
            done
          done
      - name: Compare premature actions
        run: |
          node <<'NODE'
          const fs = require('fs');
          function parse(policy) {
            const lines = fs.readFileSync(`diagnostics/${policy}.log`, 'utf8').split('\n');
            let scenario = null;
            const rows = [];
            for (const line of lines) {
              if (line.startsWith('[scenario] ')) {
                scenario = line.slice(11);
                continue;
              }
              if (!line.startsWith('[premature-debug] ')) continue;
              rows.push({ policy, scenario, ...JSON.parse(line.slice(18)) });
            }
            return rows;
          }
          const baseline = parse('baseline');
          const watch = parse('watch');
          const key = row => `${row.scenario}|${row.day}|${row.actionId}|${row.actionReason}|${row.preActionRatio}`;
          const baselineCounts = new Map();
          for (const row of baseline) baselineCounts.set(key(row), (baselineCounts.get(key(row)) ?? 0) + 1);
          const watchOnly = [];
          for (const row of watch) {
            const k = key(row);
            const count = baselineCounts.get(k) ?? 0;
            if (count > 0) baselineCounts.set(k, count - 1);
            else watchOnly.push(row);
          }
          const byScenario = {};
          for (const row of watchOnly) {
            byScenario[row.scenario] ??= [];
            byScenario[row.scenario].push(row);
          }
          const report = {
            baselinePrematureCount: baseline.length,
            watchPrematureCount: watch.length,
            netDelta: watch.length - baseline.length,
            watchOnlyCount: watchOnly.length,
            watchOnlyByScenario: byScenario,
          };
          fs.writeFileSync('diagnostics/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: apm-premature-diagnostic
          path: diagnostics/
          if-no-files-found: error
