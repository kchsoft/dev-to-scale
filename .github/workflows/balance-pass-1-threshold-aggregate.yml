name: Balance Pass 1 Threshold Aggregate

on:
  pull_request:
    branches: [feature/playable-mvp]

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: github.head_ref == 'feature/deterministic-balance-simulation-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected completed threshold sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/threshold-sweep
          gh run download 33290050385 --repo "$GITHUB_REPOSITORY" --dir artifacts/threshold-sweep
      - name: Aggregate corrected 8,100 scenario rows
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'artifacts/threshold-sweep';
          const labels = ['3_5m', '4m', '4_5m'];
          const informed = new Set(['APM_AWARE', 'METRICS_AWARE', 'ORACLE']);
          const riskier = new Set(['REACTIVE_BASIC', 'YOLO_SCALE', 'CHEAPSKATE']);

          function parseCsv(file) {
            const lines = fs.readFileSync(file, 'utf8').trimEnd().split('\n');
            const header = lines[0].split(',');
            return lines.slice(1).map((line) => {
              const values = line.split(',');
              return Object.fromEntries(header.map((name, index) => [name, values[index]]));
            });
          }

          function median(values) {
            if (values.length === 0) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
          }

          const output = {};
          for (const label of labels) {
            const artifactDirs = fs.readdirSync(root)
              .filter((name) => name.startsWith(`balance-final-threshold-${label}-`))
              .sort();
            if (artifactDirs.length !== 15) throw new Error(`${label}: expected 15 artifacts, got ${artifactDirs.length}`);

            const rows = artifactDirs.flatMap((dir) => parseCsv(path.join(root, dir, 'runs.csv')));
            if (rows.length !== 2700) throw new Error(`${label}: expected 2700 rows, got ${rows.length}`);
            const keys = new Set(rows.map((row) => [row.frameworkId, row.databaseId, row.seed, row.strategyId].join('|')));
            if (keys.size !== 2700) throw new Error(`${label}: expected 2700 unique keys, got ${keys.size}`);

            const byStrategy = {};
            for (const row of rows) {
              byStrategy[row.strategyId] ??= { runs: 0, won: 0, bankrupt: 0, timeout: 0 };
              const entry = byStrategy[row.strategyId];
              entry.runs += 1;
              if (row.terminalStatus === 'WON') entry.won += 1;
              else if (row.terminalStatus === 'BANKRUPT') entry.bankrupt += 1;
              else if (row.terminalStatus === 'TIMEOUT') entry.timeout += 1;
            }
            for (const [strategyId, entry] of Object.entries(byStrategy)) {
              if (entry.runs !== 450) throw new Error(`${label}/${strategyId}: expected 450 rows, got ${entry.runs}`);
              entry.winRate = entry.won / entry.runs;
            }

            const wonRows = rows.filter((row) => row.terminalStatus === 'WON');
            const bankrupt = rows.filter((row) => row.terminalStatus === 'BANKRUPT').length;
            const timeout = rows.filter((row) => row.terminalStatus === 'TIMEOUT').length;
            const informedRows = rows.filter((row) => informed.has(row.strategyId));
            const riskierRows = rows.filter((row) => riskier.has(row.strategyId));
            const informedWinRate = informedRows.filter((row) => row.terminalStatus === 'WON').length / informedRows.length;
            const riskierWinRate = riskierRows.filter((row) => row.terminalStatus === 'WON').length / riskierRows.length;
            const cohortDelta = informedWinRate - riskierWinRate;
            const winnerDays = wonRows.map((row) => Number(row.daysPlayed));
            const earlyWins = winnerDays.filter((days) => days < 365).length;
            const strategiesWithWins = Object.values(byStrategy).filter((entry) => entry.won > 0).length;
            const maxStrategyWinRate = Math.max(...Object.values(byStrategy).map((entry) => entry.winRate));

            const stackWins = {};
            for (const row of rows) {
              const key = `${row.frameworkId}/${row.databaseId}`;
              stackWins[key] ??= { runs: 0, won: 0 };
              stackWins[key].runs += 1;
              if (row.terminalStatus === 'WON') stackWins[key].won += 1;
            }
            for (const entry of Object.values(stackWins)) entry.winRate = entry.won / entry.runs;

            output[label] = {
              runs: rows.length,
              won: wonRows.length,
              bankrupt,
              timeout,
              winRate: wonRows.length / rows.length,
              bankruptcyRate: bankrupt / rows.length,
              timeoutRate: timeout / rows.length,
              informedWinRate,
              riskierWinRate,
              cohortDelta,
              winnerDayMedian: median(winnerDays),
              earlyWinsBefore365: earlyWins,
              strategiesWithWins,
              maxStrategyWinRate,
              byStrategy,
              stackWins,
              acceptance: {
                overallWinBand: wonRows.length / rows.length >= 0.15 && wonRows.length / rows.length <= 0.45,
                bankruptcyBand: bankrupt / rows.length >= 0.10 && bankrupt / rows.length <= 0.35,
                timeoutNonZero: timeout > 0,
                atLeastFourStrategiesWin: strategiesWithWins >= 4,
                noStrategyAbove80: maxStrategyWinRate <= 0.80,
                informedDelta10pp: cohortDelta >= 0.10,
                winnerMedianBand: median(winnerDays) >= 500 && median(winnerDays) <= 1000,
                earlyWinsRare: earlyWins <= Math.max(1, Math.floor(wonRows.length * 0.01)),
              },
            };
          }

          fs.mkdirSync('artifacts/threshold-aggregate', { recursive: true });
          fs.writeFileSync('artifacts/threshold-aggregate/summary.json', `${JSON.stringify(output, null, 2)}\n`);
          for (const label of labels) {
            const row = output[label];
            console.log(`[threshold ${label}] win=${(row.winRate * 100).toFixed(2)}% bankrupt=${(row.bankruptcyRate * 100).toFixed(2)}% timeout=${(row.timeoutRate * 100).toFixed(2)}% informed=${(row.informedWinRate * 100).toFixed(2)}% riskier=${(row.riskierWinRate * 100).toFixed(2)}% delta=${(row.cohortDelta * 100).toFixed(2)}pp median=${row.winnerDayMedian} early<365=${row.earlyWinsBefore365}`);
            console.log(`[threshold ${label}] acceptance=${JSON.stringify(row.acceptance)}`);
            console.log(`[threshold ${label}] strategies=${JSON.stringify(row.byStrategy)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: balance-threshold-aggregate-corrected
          path: artifacts/threshold-aggregate/summary.json
          if-no-files-found: error
