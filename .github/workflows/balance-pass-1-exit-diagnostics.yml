name: Balance Pass 1 Exit Diagnostics

on:
  pull_request:
    branches: [feature/playable-mvp]

jobs:
  diagnose:
    if: github.head_ref == 'feature/deterministic-balance-simulation-harness'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Measure all-seed post-finish settlements with exit disabled
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          mkdir -p artifacts/exit-diagnostics
          sed -i 's/EXIT_MONTHLY_REVENUE_TARGET = 143_000_000/EXIT_MONTHLY_REVENUE_TARGET = 1_000_000_000/' src/core/finance.ts
          cat > .tmp-exit-diagnostics.ts <<'TS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { buildBalanceScenarios, parseBalanceArgs, runBalanceScenario } from './src/simulation';

          const framework = process.env.FRAMEWORK;
          const database = process.env.DATABASE;
          if (!framework || !database) throw new Error('FRAMEWORK and DATABASE are required');

          const options = parseBalanceArgs(['--framework', framework, '--db', database]);
          const scenarios = buildBalanceScenarios({
            frameworkId: options.frameworkId,
            databaseId: options.databaseId,
          });
          if (scenarios.length !== 180) throw new Error(`expected 180 scenarios, got ${scenarios.length}`);

          const lines: string[] = [];
          for (const scenario of scenarios) {
            const traced = runBalanceScenario(scenario, { trace: true });
            const firstFinished = traced.trace.find((entry) => entry.completedFeatureCount === 10);
            if (!firstFinished) {
              lines.push(JSON.stringify({
                frameworkId: scenario.frameworkId,
                databaseId: scenario.databaseId,
                seed: scenario.seed,
                strategyId: scenario.strategyId,
                terminalStatus: traced.result.terminalStatus,
                completionDay: null,
                postFinishedSettlements: [],
              }));
              continue;
            }

            const baselineMonth = firstFinished.lastSettlementMonth ?? 0;
            const settlements = new Map<number, number>();
            for (const entry of traced.trace) {
              if (entry.completedFeatureCount !== 10) continue;
              if (entry.lastSettlementMonth === null || entry.lastSettlementMonth <= baselineMonth) continue;
              if (entry.lastSettlementRevenue === null) continue;
              if (!settlements.has(entry.lastSettlementMonth)) {
                settlements.set(entry.lastSettlementMonth, entry.lastSettlementRevenue);
              }
            }

            lines.push(JSON.stringify({
              frameworkId: scenario.frameworkId,
              databaseId: scenario.databaseId,
              seed: scenario.seed,
              strategyId: scenario.strategyId,
              terminalStatus: traced.result.terminalStatus,
              completionDay: firstFinished.day,
              baselineSettlementMonth: baselineMonth,
              postFinishedSettlements: [...settlements.entries()]
                .sort((a, b) => a[0] - b[0])
                .map(([month, revenue]) => ({ month, revenue })),
            }));
          }

          await mkdir('artifacts/exit-diagnostics', { recursive: true });
          await writeFile('artifacts/exit-diagnostics/diagnostics.jsonl', `${lines.join('\n')}\n`, 'utf8');
          TS
          npx tsx .tmp-exit-diagnostics.ts
          node - <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('artifacts/exit-diagnostics/diagnostics.jsonl', 'utf8').trim().split('\n').filter(Boolean);
          if (rows.length !== 180) throw new Error(`expected 180 diagnostic rows, got ${rows.length}`);
          const parsed = rows.map(JSON.parse);
          const keys = new Set(parsed.map((row) => [row.frameworkId, row.databaseId, row.seed, row.strategyId].join('|')));
          if (keys.size !== 180) throw new Error(`expected 180 unique keys, got ${keys.size}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: balance-exit-diagnostics-all-${{ matrix.framework }}-${{ matrix.database }}
          path: artifacts/exit-diagnostics/diagnostics.jsonl
          if-no-files-found: error
