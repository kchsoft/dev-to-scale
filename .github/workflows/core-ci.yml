name: Core Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/core-engine-v1]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
