name: Dev to Scale CI

on:
  pull_request:
    branches: [main, feature/playable-mvp, feature/core-engine-v1, feature/mvp-ui-tweaks]
  push:
    branches: [feature/core-engine-v1, feature/ui-rebuild-v1, feature/request-flow-v1, feature/cpu-io-load-v1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Balance CLI smoke
        run: |
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE --trace > /tmp/balance-smoke.log
          node -e "const fs=require('fs');const rows=fs.readFileSync('artifacts/balance/runs.csv','utf8').trimEnd().split('\n').length-1;if(rows!==1)throw new Error('expected 1 smoke row, got '+rows);const s=JSON.parse(fs.readFileSync('artifacts/balance/summary.json','utf8'));if(s.runCount!==1)throw new Error('expected smoke runCount=1, got '+s.runCount);"
          grep -q '^\[trace\] ' /tmp/balance-smoke.log
      - name: Deterministic rerun evidence
        run: |
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE > artifacts/balance/deterministic-a.log
          cp artifacts/balance/runs.csv artifacts/balance/deterministic-a.csv
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE > artifacts/balance/deterministic-b.log
          diff -u artifacts/balance/deterministic-a.csv artifacts/balance/runs.csv
          cp artifacts/balance/runs.csv artifacts/balance/deterministic-b.csv
      - name: Representative strategy traces
        run: |
          for strategy in ORACLE APM_AWARE YOLO_SCALE CHEAPSKATE; do
            npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy "$strategy" --trace > "artifacts/balance/trace-${strategy}.log"
          done
      - name: Verify generated artifacts stay ignored
        run: |
          if git status --short | grep -q '^?? artifacts/balance/'; then
            echo 'balance artifacts are not ignored'
            git status --short
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-verification-evidence
          path: |
            artifacts/balance/
            /tmp/balance-smoke.log
          if-no-files-found: error
