name: Dev to Scale CI

on:
  pull_request:
    branches: [main, feature/playable-mvp, feature/core-engine-v1]
  push:
    branches: [feature/core-engine-v1, feature/ui-rebuild-v1, feature/request-flow-v1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
