name: Balance Pass 2 Pilot

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run five-seed shard
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/pilot
          aggregate="artifacts/pilot/${FRAMEWORK}-${DATABASE}.csv"
          : > "$aggregate"
          first=1
          for seed in 5 8 17 23 29; do
            npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" --seed "$seed" > "artifacts/pilot/${FRAMEWORK}-${DATABASE}-${seed}.log"
            if [ "$first" -eq 1 ]; then
              cat artifacts/balance/runs.csv > "$aggregate"
              first=0
            else
              tail -n +2 artifacts/balance/runs.csv >> "$aggregate"
            fi
          done
      - name: Validate shard integrity
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const framework = process.env.FRAMEWORK;
          const database = process.env.DATABASE;
          const path = `artifacts/pilot/${framework}-${database}.csv`;
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n');
          const header = lines[0].split(',');
          const rows = lines.slice(1).map(line => {
            const values = line.split(',');
            return Object.fromEntries(header.map((key, index) => [key, values[index]]));
          });
          if (rows.length !== 30) throw new Error(`expected 30 rows, got ${rows.length}`);
          const expectedSeeds = [5, 8, 17, 23, 29];
          for (const seed of expectedSeeds) {
            const matches = rows.filter(row => Number(row.seed) === seed);
            if (matches.length !== 6) throw new Error(`seed ${seed}: expected 6 rows, got ${matches.length}`);
          }
          const actualSeeds = [...new Set(rows.map(row => Number(row.seed)))].sort((a,b) => a-b);
          if (JSON.stringify(actualSeeds) !== JSON.stringify(expectedSeeds)) {
            throw new Error(`unexpected seeds: ${actualSeeds.join(',')}`);
          }
          const keys = new Set(rows.map(row => `${row.frameworkId}|${row.databaseId}|${row.seed}|${row.strategyId}`));
          if (keys.size !== 30) throw new Error(`expected 30 unique scenario keys, got ${keys.size}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-${{ matrix.framework }}-${{ matrix.database }}
          path: |
            artifacts/pilot/${{ matrix.framework }}-${{ matrix.database }}.csv
            artifacts/pilot/${{ matrix.framework }}-${{ matrix.database }}-*.log
          if-no-files-found: error
