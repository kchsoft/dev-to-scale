name: BP2 Informed Path Trace

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  trace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: fastapi-pg-23
            framework: FASTAPI
            database: POSTGRESQL
            seed: 23
            strategy: METRICS_AWARE
          - case_id: fastapi-pg-23
            framework: FASTAPI
            database: POSTGRESQL
            seed: 23
            strategy: APM_AWARE
          - case_id: fastapi-pg-23
            framework: FASTAPI
            database: POSTGRESQL
            seed: 23
            strategy: ORACLE
          - case_id: fastapi-mysql-29
            framework: FASTAPI
            database: MYSQL
            seed: 29
            strategy: METRICS_AWARE
          - case_id: fastapi-mysql-29
            framework: FASTAPI
            database: MYSQL
            seed: 29
            strategy: APM_AWARE
          - case_id: fastapi-mysql-29
            framework: FASTAPI
            database: MYSQL
            seed: 29
            strategy: ORACLE
          - case_id: spring-pg-23
            framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 23
            strategy: METRICS_AWARE
          - case_id: spring-pg-23
            framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 23
            strategy: APM_AWARE
          - case_id: spring-pg-23
            framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 23
            strategy: ORACLE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Trace scenario
        run: |
          mkdir -p traces
          npm run balance -- --framework "${{ matrix.framework }}" --db "${{ matrix.database }}" --seed "${{ matrix.seed }}" --strategy "${{ matrix.strategy }}" --trace > "traces/${{ matrix.case_id }}-${{ matrix.strategy }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: informed-trace-${{ matrix.case_id }}-${{ matrix.strategy }}
          path: traces/*.log
          if-no-files-found: error

  aggregate:
    runs-on: ubuntu-latest
    needs: trace
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: informed-trace-*
          path: traces
          merge-multiple: true
      - name: Extract first divergences
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cases=['fastapi-pg-23','fastapi-mysql-29','spring-pg-23'];
          const strategies=['METRICS_AWARE','APM_AWARE','ORACLE'];
          function read(caseId,strategy){
            const file=`traces/${caseId}-${strategy}.log`;
            return fs.readFileSync(file,'utf8').split('\n')
              .filter(line=>line.startsWith('[trace] '))
              .map(line=>JSON.parse(line.slice(8)));
          }
          function terminal(caseId,strategy){
            const text=fs.readFileSync(`traces/${caseId}-${strategy}.log`,'utf8');
            const line=text.split('\n').find(l=>l.startsWith('[balance] terminal '));
            return line ?? null;
          }
          const report={};
          for(const c of cases){
            const by=Object.fromEntries(strategies.map(s=>[s,read(c,s)]));
            const base=by.METRICS_AWARE;
            const item={terminal:Object.fromEntries(strategies.map(s=>[s,terminal(c,s)])),comparisons:{}};
            for(const other of ['APM_AWARE','ORACLE']){
              const rhs=by[other];
              const n=Math.min(base.length,rhs.length);
              let idx=-1;
              for(let i=0;i<n;i++){
                if(base[i].actionId!==rhs[i].actionId || base[i].viralControl!==rhs[i].viralControl){idx=i;break;}
              }
              const around=(arr)=>idx<0?[]:arr.slice(Math.max(0,idx-2),Math.min(arr.length,idx+8)).map(e=>({day:e.day,level:e.observabilityLevel,action:e.actionId,reason:e.actionReason,cash:e.cash,dau:e.dau,signal:e.hottestVisibleSignal,viral:e.viralControl,features:e.completedFeatureCount,slo:e.sloPassed}));
              item.comparisons[other]={firstDivergenceIndex:idx,metrics:around(base),other:around(rhs)};
            }
            report[c]=item;
          }
          fs.writeFileSync('informed-path-divergence.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: informed-path-divergence
          path: informed-path-divergence.json
          if-no-files-found: error
