name: Balance Pass 2 Release Diagnostics

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  trace:
    name: GIN/MONGODB seed17 / ${{ matrix.strategy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [APM_AWARE, METRICS_AWARE, ORACLE, REACTIVE_BASIC, YOLO_SCALE, CHEAPSKATE]
    env:
      STRATEGY: ${{ matrix.strategy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run diagnostic trace
        run: |
          mkdir -p artifacts/diagnostics
          npm run balance -- --seed 17 --framework GIN --db MONGODB --strategy "$STRATEGY" --trace > "artifacts/diagnostics/${STRATEGY}.log"
          cp artifacts/balance/runs.csv "artifacts/diagnostics/${STRATEGY}.csv"
      - name: Summarize release windows
        run: |
          node <<'NODE'
          const fs = require('fs');
          const strategy = process.env.STRATEGY;
          const trace = fs.readFileSync(`artifacts/diagnostics/${strategy}.log`, 'utf8')
            .split('\n')
            .filter((line) => line.startsWith('[trace] '))
            .map((line) => JSON.parse(line.slice('[trace] '.length)));
          function percent(signal) {
            const match = /:(\d+)%$/.exec(signal);
            return match ? Number(match[1]) : 0;
          }
          const releases = [];
          for (let i = 1; i < trace.length; i += 1) {
            const previous = trace[i - 1];
            const current = trace[i];
            if (current.completedFeatureCount <= previous.completedFeatureCount) continue;
            const window = trace.slice(i, i + 7);
            const prior = trace.slice(Math.max(0, i - 14), i);
            releases.push({
              firstLiveDay: current.day,
              completedFeatureCount: current.completedFeatureCount,
              overloadedDays: window.filter((entry) => percent(entry.hottestVisibleSignal) > 100).length,
              signals: window.map((entry) => ({
                day: entry.day,
                signal: entry.hottestVisibleSignal,
                actionId: entry.actionId,
                actionReason: entry.actionReason,
              })),
              priorReadinessActions: prior
                .filter((entry) => entry.actionReason.startsWith('prepare '))
                .map((entry) => ({ day: entry.day, actionId: entry.actionId, actionReason: entry.actionReason })),
            });
          }
          const output = {
            strategy,
            releases,
            totalDerivedPostReleaseOverloadDays: releases.reduce((sum, release) => sum + release.overloadedDays, 0),
          };
          fs.writeFileSync(
            `artifacts/diagnostics/${strategy}-release-windows.json`,
            JSON.stringify(output, null, 2) + '\n',
          );
          console.log(JSON.stringify(output));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: balance-pass-2-release-diagnostics-${{ matrix.strategy }}
          path: artifacts/diagnostics/
          if-no-files-found: error
