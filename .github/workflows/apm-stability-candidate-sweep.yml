name: APM Stability Candidate Sweep

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - name: Checkout current policy
        uses: actions/checkout@v4
        with:
          path: current
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: 161af3532aaa1a082536f77b13b1118d729372e3
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create candidate policies
        run: |
          cp -R current health
          cp -R current threshold80
          cp -R current threshold85
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/simulation/release-readiness.ts';
          const needle = '  if (bottleneck.effectiveRatio < 0.70) return null;';
          const variants = {
            health: "  if (observation.serviceHealth === 'HEALTHY' || bottleneck.effectiveRatio < 0.70) return null;",
            threshold80: '  if (bottleneck.effectiveRatio < 0.80) return null;',
            threshold85: '  if (bottleneck.effectiveRatio < 0.85) return null;',
          };
          for (const [root, replacement] of Object.entries(variants)) {
            const file = `${root}/${path}`;
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(needle)) throw new Error(`${root}: APM stability gate not found`);
            fs.writeFileSync(file, source.replace(needle, replacement));
          }
          NODE
      - name: Install dependencies
        run: |
          for root in baseline current health threshold80 threshold85; do
            (cd "$root" && npm install)
          done
      - name: Run APM candidate shard
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          mkdir -p paired
          for policy in baseline current health threshold80 threshold85; do
            aggregate="paired/${policy}-${FRAMEWORK}-${DATABASE}.csv"
            : > "$aggregate"
            first=1
            for seed in $(seq 1 30); do
              (cd "$policy" && npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" --seed "$seed" --strategy APM_AWARE) \
                > /dev/null
              if [ "$first" -eq 1 ]; then
                cat "$policy/artifacts/balance/runs.csv" > "$aggregate"
                first=0
              else
                tail -n +2 "$policy/artifacts/balance/runs.csv" >> "$aggregate"
              fi
            done
          done
      - name: Validate shard
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const framework = process.env.FRAMEWORK;
          const database = process.env.DATABASE;
          for (const policy of ['baseline', 'current', 'health', 'threshold80', 'threshold85']) {
            const file = `paired/${policy}-${framework}-${database}.csv`;
            const lines = fs.readFileSync(file, 'utf8').trimEnd().split('\n');
            if (lines.length !== 31) throw new Error(`${policy}: expected header + 30 rows, got ${lines.length}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: apm-sweep-${{ matrix.framework }}-${{ matrix.database }}
          path: paired/*.csv
          if-no-files-found: error

  aggregate:
    runs-on: ubuntu-latest
    needs: shard
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apm-sweep-*
          path: sweep-all
          merge-multiple: true
      - name: Aggregate candidate sweep
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'sweep-all';
          const policies = ['baseline', 'current', 'health', 'threshold80', 'threshold85'];
          const files = fs.readdirSync(root).filter(name => name.endsWith('.csv'));
          function parseCsv(file) {
            const lines = fs.readFileSync(path.join(root, file), 'utf8').trimEnd().split('\n');
            const header = lines[0].split(',');
            return lines.slice(1).map(line => {
              const values = line.split(',');
              return Object.fromEntries(header.map((key, index) => [key, values[index]]));
            });
          }
          const rows = Object.fromEntries(policies.map(policy => [policy, []]));
          for (const file of files) {
            for (const policy of policies) {
              if (file.startsWith(`${policy}-`)) rows[policy].push(...parseCsv(file));
            }
          }
          for (const policy of policies) {
            if (rows[policy].length !== 450) throw new Error(`${policy}: expected 450 rows, got ${rows[policy].length}`);
          }
          const mean = xs => xs.reduce((a,b) => a+b, 0) / xs.length;
          const metrics = [
            'failureDays','overloadDays','postReleaseOverloadDays','prematureCapacityActions',
            'lowUtilizationExpandedNodeDays','infrastructureCostExposure','endingCash','daysPlayed'
          ];
          function summarize(selected) {
            const out = {
              runs: selected.length,
              wins: selected.filter(r => r.terminalStatus === 'WON').length,
              bankrupt: selected.filter(r => r.terminalStatus === 'BANKRUPT').length,
              timeout: selected.filter(r => r.terminalStatus === 'TIMEOUT').length,
            };
            out.winRate = out.wins / out.runs;
            for (const metric of metrics) out[metric] = mean(selected.map(r => Number(r[metric])));
            return out;
          }
          const baselineByKey = new Map(rows.baseline.map(r => [`${r.frameworkId}|${r.databaseId}|${r.seed}`, r]));
          const report = { summaries: {}, deltaVsBaseline: {}, transitionsVsBaseline: {}, harmfulByStack: {} };
          const baselineSummary = summarize(rows.baseline);
          for (const policy of policies) {
            const summary = summarize(rows[policy]);
            report.summaries[policy] = summary;
            report.deltaVsBaseline[policy] = Object.fromEntries(
              ['winRate', ...metrics].map(metric => [metric, summary[metric] - baselineSummary[metric]])
            );
            if (policy === 'baseline') continue;
            const transitions = {};
            const harmful = {};
            for (const after of rows[policy]) {
              const key = `${after.frameworkId}|${after.databaseId}|${after.seed}`;
              const before = baselineByKey.get(key);
              const transition = `${before.terminalStatus}->${after.terminalStatus}`;
              transitions[transition] = (transitions[transition] ?? 0) + 1;
              if (transition === 'WON->TIMEOUT') {
                const stack = `${after.frameworkId}|${after.databaseId}`;
                harmful[stack] = (harmful[stack] ?? 0) + 1;
              }
            }
            report.transitionsVsBaseline[policy] = transitions;
            report.harmfulByStack[policy] = harmful;
          }
          fs.writeFileSync('apm-candidate-sweep.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: apm-stability-candidate-sweep-summary
          path: apm-candidate-sweep.json
          if-no-files-found: error
