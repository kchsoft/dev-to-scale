name: Oracle Root Cause Trace

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  trace:
    if: github.event.head_commit.message == 'ci: add oracle root-cause trace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture same-seed strategy traces
        run: |
          set -euo pipefail
          mkdir -p oracle-trace
          for strategy in ORACLE METRICS_AWARE APM_AWARE REACTIVE_BASIC; do
            npm run balance -- --framework SPRING_BOOT --db MYSQL --seed 28 --strategy "$strategy" --trace > "oracle-trace/${strategy}.log"
            cp artifacts/balance/runs.csv "oracle-trace/${strategy}.csv"
          done
      - name: Extract investment timeline
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const strategy of ['ORACLE','METRICS_AWARE','APM_AWARE','REACTIVE_BASIC']) {
            const file = `oracle-trace/${strategy}.log`;
            const lines = fs.readFileSync(file, 'utf8').split('\n');
            const interesting = lines.filter(line => (
              line.includes('START_TECHNOLOGY_BUILD') ||
              line.includes('RESIZE_NODE') ||
              line.includes('SCALE_OUT_NODE') ||
              line.includes('POST_RELEASE') ||
              line.includes('RELEASE_READINESS')
            ));
            fs.writeFileSync(`oracle-trace/${strategy}-investments.log`, interesting.join('\n') + '\n');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-root-cause-trace
          path: oracle-trace/
          if-no-files-found: error
