name: Corrected Balance Evidence

on:
  pull_request:
    branches: [feature/playable-mvp]

jobs:
  full-balance-shard:
    if: github.head_ref == 'feature/deterministic-balance-simulation-harness'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run 180-scenario shard
        run: |
          npm run balance -- --framework "${{ matrix.framework }}" --db "${{ matrix.database }}" > artifacts/balance/console.log
          node -e "const fs=require('fs');const rows=fs.readFileSync('artifacts/balance/runs.csv','utf8').trimEnd().split('\n').length-1;if(rows!==180)throw new Error('expected 180 rows, got '+rows);const s=JSON.parse(fs.readFileSync('artifacts/balance/summary.json','utf8'));if(s.runCount!==180)throw new Error('expected runCount=180, got '+s.runCount);"
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-balance-${{ matrix.framework }}-${{ matrix.database }}
          path: artifacts/balance/
          if-no-files-found: error
