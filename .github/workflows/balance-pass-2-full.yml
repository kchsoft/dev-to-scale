name: Balance Pass 2 Full Matrix

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run full shard
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" > "full-${FRAMEWORK}-${DATABASE}.log"
      - name: Validate shard integrity
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('artifacts/balance/runs.csv', 'utf8').trimEnd().split('\n').length - 1;
          if (rows !== 180) throw new Error(`expected 180 rows, got ${rows}`);
          const summary = JSON.parse(fs.readFileSync('artifacts/balance/summary.json', 'utf8'));
          if (summary.runCount !== 180) throw new Error(`expected summary.runCount=180, got ${summary.runCount}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.framework }}-${{ matrix.database }}
          path: |
            artifacts/balance/runs.csv
            artifacts/balance/summary.json
            full-${{ matrix.framework }}-${{ matrix.database }}.log
          if-no-files-found: error
