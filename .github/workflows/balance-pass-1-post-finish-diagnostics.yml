name: Balance Pass 1 Post-Finish Diagnostics

on:
  pull_request:
    branches: [feature/playable-mvp]

jobs:
  diagnose:
    if: github.head_ref == 'feature/deterministic-balance-simulation-harness'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 5
          - framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 17
          - framework: SPRING_BOOT
            database: POSTGRESQL
            seed: 29
          - framework: NESTJS
            database: MYSQL
            seed: 23
          - framework: GIN
            database: MONGODB
            seed: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Measure settlements after progression finishes
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p artifacts/post-finish
          echo 'frameworkId,databaseId,seed,strategyId,completionDay,baselineSettlementMonth,firstPostFinishedSettlementMonth,firstPostFinishedRevenue,maxPostFinishedRevenue,postFinishedSettlementCount' > artifacts/post-finish/summary.csv
          for STRATEGY in ORACLE APM_AWARE METRICS_AWARE REACTIVE_BASIC YOLO_SCALE CHEAPSKATE; do
            TRACE="artifacts/post-finish/trace-${STRATEGY}.log"
            npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" --seed "$SEED" --strategy "$STRATEGY" --trace > "$TRACE"
            node - "$FRAMEWORK" "$DATABASE" "$SEED" "$STRATEGY" "$TRACE" <<'NODE' >> artifacts/post-finish/summary.csv
          const fs = require('fs');
          const [framework, database, seed, strategy, tracePath] = process.argv.slice(2);
          const entries = fs.readFileSync(tracePath, 'utf8')
            .split('\n')
            .filter((line) => line.startsWith('[trace] '))
            .map((line) => JSON.parse(line.slice('[trace] '.length)));
          const firstFinished = entries.find((entry) => entry.completedFeatureCount === 10);
          if (!firstFinished) {
            console.log([framework, database, seed, strategy, '', '', '', '', '', 0].join(','));
            process.exit(0);
          }
          const baselineMonth = firstFinished.lastSettlementMonth ?? 0;
          const settlements = new Map();
          for (const entry of entries) {
            if (entry.completedFeatureCount !== 10) continue;
            if (entry.lastSettlementMonth === null || entry.lastSettlementMonth <= baselineMonth) continue;
            if (!settlements.has(entry.lastSettlementMonth)) {
              settlements.set(entry.lastSettlementMonth, entry.lastSettlementRevenue);
            }
          }
          const values = [...settlements.entries()].sort((a, b) => a[0] - b[0]);
          const first = values[0] ?? [null, null];
          const maxRevenue = values.length ? Math.max(...values.map(([, revenue]) => revenue ?? 0)) : null;
          console.log([
            framework,
            database,
            seed,
            strategy,
            firstFinished.day,
            baselineMonth,
            first[0] ?? '',
            first[1] ?? '',
            maxRevenue ?? '',
            values.length,
          ].join(','));
          NODE
          done
      - uses: actions/upload-artifact@v4
        with:
          name: balance-pass-1-post-finish-${{ matrix.framework }}-${{ matrix.database }}-seed-${{ matrix.seed }}
          path: artifacts/post-finish/
          if-no-files-found: error
