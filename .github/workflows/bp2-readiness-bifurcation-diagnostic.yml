name: BP2 Readiness Bifurcation Diagnostic

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run matched harmful and beneficial traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p traces
          for seed in 17 18; do
            for strategy in REACTIVE_BASIC METRICS_AWARE APM_AWARE ORACLE; do
              npm run balance -- \
                --framework GIN \
                --db MYSQL \
                --seed "$seed" \
                --strategy "$strategy" \
                --trace > "traces/seed-${seed}-${strategy}.log"
            done
          done
      - name: Summarize first behavioral divergences
        shell: bash
        run: |
          node <<'NODE' | tee traces/summary.txt
          const fs = require('fs');
          const strategies = ['METRICS_AWARE', 'APM_AWARE', 'ORACLE'];
          const seeds = [17, 18];

          function readTrace(seed, strategy) {
            const text = fs.readFileSync(`traces/seed-${seed}-${strategy}.log`, 'utf8');
            return text.split('\n')
              .filter(line => line.startsWith('[trace] '))
              .map(line => JSON.parse(line.slice('[trace] '.length)));
          }

          function behavior(entry) {
            return JSON.stringify({
              actionId: entry.actionId,
              viralControl: entry.viralControl,
              incidentControl: entry.incidentControl,
            });
          }

          function compact(entry) {
            if (!entry) return null;
            return {
              day: entry.day,
              actionId: entry.actionId,
              reason: entry.actionReason,
              dau: entry.dau,
              cash: entry.cash,
              features: entry.completedFeatureCount,
              signal: entry.hottestVisibleSignal,
              viral: entry.viralControl,
              incident: entry.incidentControl,
              settlementMonth: entry.lastSettlementMonth,
              settlementRevenue: entry.lastSettlementRevenue,
            };
          }

          for (const seed of seeds) {
            const baseline = readTrace(seed, 'REACTIVE_BASIC');
            console.log(`=== seed ${seed} (${seed === 18 ? 'HARMFUL' : 'BENEFICIAL'}) ===`);
            console.log(`REACTIVE terminal-days=${baseline.length}`);
            for (const strategy of strategies) {
              const candidate = readTrace(seed, strategy);
              const limit = Math.min(baseline.length, candidate.length);
              let first = -1;
              for (let i = 0; i < limit; i += 1) {
                if (behavior(baseline[i]) !== behavior(candidate[i])) {
                  first = i;
                  break;
                }
              }
              console.log(`--- ${strategy} terminal-days=${candidate.length} firstBehavioralDivergence=${first < 0 ? 'none' : baseline[first].day} ---`);
              if (first >= 0) {
                const start = Math.max(0, first - 5);
                const end = Math.min(limit, first + 8);
                for (let i = start; i < end; i += 1) {
                  console.log(JSON.stringify({
                    reactive: compact(baseline[i]),
                    informed: compact(candidate[i]),
                    diverged: behavior(baseline[i]) !== behavior(candidate[i]),
                  }));
                }
              }

              const reactiveFeatureDays = [];
              const informedFeatureDays = [];
              for (let i = 1; i < baseline.length; i += 1) {
                if (baseline[i].completedFeatureCount !== baseline[i - 1].completedFeatureCount) {
                  reactiveFeatureDays.push([baseline[i].day, baseline[i].completedFeatureCount]);
                }
              }
              for (let i = 1; i < candidate.length; i += 1) {
                if (candidate[i].completedFeatureCount !== candidate[i - 1].completedFeatureCount) {
                  informedFeatureDays.push([candidate[i].day, candidate[i].completedFeatureCount]);
                }
              }
              console.log(`reactiveFeatureDays=${JSON.stringify(reactiveFeatureDays)}`);
              console.log(`informedFeatureDays=${JSON.stringify(informedFeatureDays)}`);
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bp2-readiness-bifurcation-traces
          path: traces
          if-no-files-found: error
