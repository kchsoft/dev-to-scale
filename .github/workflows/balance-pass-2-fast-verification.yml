name: Balance Pass 2 Fast Verification

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Deterministic informed scenario
        run: |
          mkdir -p artifacts/task9
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE > artifacts/task9/apm-a.log
          cp artifacts/balance/runs.csv artifacts/task9/apm-a.csv
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE > artifacts/task9/apm-b.log
          cp artifacts/balance/runs.csv artifacts/task9/apm-b.csv
          diff -u artifacts/task9/apm-a.csv artifacts/task9/apm-b.csv

      - name: Deterministic reactive scenario
        run: |
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy REACTIVE_BASIC > artifacts/task9/reactive-a.log
          cp artifacts/balance/runs.csv artifacts/task9/reactive-a.csv
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy REACTIVE_BASIC > artifacts/task9/reactive-b.log
          cp artifacts/balance/runs.csv artifacts/task9/reactive-b.csv
          diff -u artifacts/task9/reactive-a.csv artifacts/task9/reactive-b.csv

      - name: Verify pre-release readiness trace
        run: |
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy APM_AWARE --trace > artifacts/task9/apm-trace.log
          npm run balance -- --seed 17 --framework SPRING_BOOT --db POSTGRESQL --strategy REACTIVE_BASIC --trace > artifacts/task9/reactive-trace.log
          node <<'NODE'
          const fs = require('fs');
          function trace(path) {
            return fs.readFileSync(path, 'utf8').split('\n')
              .filter((line) => line.startsWith('[trace] '))
              .map((line) => JSON.parse(line.slice('[trace] '.length)));
          }
          const apm = trace('artifacts/task9/apm-trace.log');
          const reactive = trace('artifacts/task9/reactive-trace.log');
          const readiness = apm.find((entry) => entry.actionReason.startsWith('prepare ') && entry.actionReason.includes(' release'));
          if (!readiness) throw new Error('APM_AWARE emitted no pre-release readiness action');
          const laterCompletion = apm.find((entry) => (
            entry.day > readiness.day && entry.completedFeatureCount > readiness.completedFeatureCount
          ));
          if (!laterCompletion) {
            throw new Error(`No later feature completion after readiness day ${readiness.day}`);
          }
          const reactiveReadiness = reactive.find((entry) => entry.actionReason.startsWith('prepare ') && entry.actionReason.includes(' release'));
          if (reactiveReadiness) {
            throw new Error(`REACTIVE_BASIC unexpectedly emitted readiness action on day ${reactiveReadiness.day}`);
          }
          const evidence = {
            informedReadiness: {
              day: readiness.day,
              completedFeatureCount: readiness.completedFeatureCount,
              actionId: readiness.actionId,
              actionReason: readiness.actionReason,
            },
            laterCompletion: {
              day: laterCompletion.day,
              completedFeatureCount: laterCompletion.completedFeatureCount,
            },
            reactiveReadinessCount: 0,
          };
          fs.writeFileSync('artifacts/task9/pre-release-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: balance-pass-2-fast-verification
          path: artifacts/task9/
          if-no-files-found: error
