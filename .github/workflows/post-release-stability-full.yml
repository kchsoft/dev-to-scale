name: Post Release Stability Full Matrix

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - name: Checkout watch policy
        uses: actions/checkout@v4
        with:
          path: watch
      - name: Checkout restored 85 percent baseline
        uses: actions/checkout@v4
        with:
          ref: 161af3532aaa1a082536f77b13b1118d729372e3
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          (cd watch && npm install)
          (cd baseline && npm install)
      - name: Run paired thirty-seed shard
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          mkdir -p paired
          for policy in baseline watch; do
            aggregate="paired/${policy}-${FRAMEWORK}-${DATABASE}.csv"
            : > "$aggregate"
            first=1
            for seed in $(seq 1 30); do
              (cd "$policy" && npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" --seed "$seed") \
                > "paired/${policy}-${FRAMEWORK}-${DATABASE}-${seed}.log"
              if [ "$first" -eq 1 ]; then
                cat "$policy/artifacts/balance/runs.csv" > "$aggregate"
                first=0
              else
                tail -n +2 "$policy/artifacts/balance/runs.csv" >> "$aggregate"
              fi
            done
          done
      - name: Validate shard integrity
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const framework = process.env.FRAMEWORK;
          const database = process.env.DATABASE;
          const expectedStrategies = ['ORACLE', 'APM_AWARE', 'METRICS_AWARE', 'REACTIVE_BASIC', 'YOLO_SCALE', 'CHEAPSKATE'];
          for (const policy of ['baseline', 'watch']) {
            const path = `paired/${policy}-${framework}-${database}.csv`;
            const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n');
            const header = lines[0].split(',');
            const rows = lines.slice(1).map(line => {
              const values = line.split(',');
              return Object.fromEntries(header.map((key, index) => [key, values[index]]));
            });
            if (rows.length !== 180) throw new Error(`${policy}: expected 180 rows, got ${rows.length}`);
            const keys = new Set(rows.map(row => `${row.frameworkId}|${row.databaseId}|${row.seed}|${row.strategyId}`));
            if (keys.size !== 180) throw new Error(`${policy}: expected 180 unique keys, got ${keys.size}`);
            for (let seed = 1; seed <= 30; seed += 1) {
              for (const strategyId of expectedStrategies) {
                const key = `${framework}|${database}|${seed}|${strategyId}`;
                if (!keys.has(key)) throw new Error(`${policy}: missing ${key}`);
              }
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: full-paired-${{ matrix.framework }}-${{ matrix.database }}
          path: |
            paired/baseline-${{ matrix.framework }}-${{ matrix.database }}.csv
            paired/watch-${{ matrix.framework }}-${{ matrix.database }}.csv
          if-no-files-found: error

  aggregate:
    runs-on: ubuntu-latest
    needs: shard
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: full-paired-*
          path: paired-all
          merge-multiple: true
      - name: Aggregate paired full matrix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'paired-all';
          const files = fs.readdirSync(root).filter(name => name.endsWith('.csv')).sort();

          function parseCsv(file) {
            const lines = fs.readFileSync(path.join(root, file), 'utf8').trimEnd().split('\n');
            const header = lines[0].split(',');
            return lines.slice(1).map(line => {
              const values = line.split(',');
              return Object.fromEntries(header.map((key, index) => [key, values[index]]));
            });
          }

          const rows = { baseline: [], watch: [] };
          for (const file of files) {
            if (file.startsWith('baseline-')) rows.baseline.push(...parseCsv(file));
            if (file.startsWith('watch-')) rows.watch.push(...parseCsv(file));
          }
          for (const policy of ['baseline', 'watch']) {
            if (rows[policy].length !== 2700) throw new Error(`${policy}: expected 2700 rows, got ${rows[policy].length}`);
            const keys = new Set(rows[policy].map(row => `${row.frameworkId}|${row.databaseId}|${row.seed}|${row.strategyId}`));
            if (keys.size !== 2700) throw new Error(`${policy}: expected 2700 unique keys, got ${keys.size}`);
          }

          const informed = new Set(['METRICS_AWARE', 'APM_AWARE', 'ORACLE']);
          const riskier = new Set(['REACTIVE_BASIC', 'YOLO_SCALE', 'CHEAPSKATE']);
          const strategyIds = ['METRICS_AWARE', 'APM_AWARE', 'ORACLE', 'REACTIVE_BASIC', 'YOLO_SCALE', 'CHEAPSKATE'];
          const numericMetrics = [
            'daysPlayed', 'finalDau', 'peakDau', 'completedFeatureCount', 'missingRequiredDependencyDays',
            'peakMonthlyRevenue', 'endingCash', 'minimumCash', 'failureDays', 'severeFailureDays',
            'cumulativeFailureBurden', 'overloadDays', 'preventativeDependencyBuildCount',
            'preventativeCapacityActionCount', 'postReleaseOverloadDays', 'featuresReleasedIntoOverload',
            'incidentCount', 'technologyBuildSpend', 'learningSpend', 'burstSpend',
            'settledInfrastructureSpend', 'infrastructureCostExposure', 'resizeCount', 'appScaleOutCount',
            'dbReplicaActionCount', 'prematureCapacityActions', 'lowUtilizationExpandedNodeDays',
            'viralRideCount', 'viralThrottleCount', 'viralBurstCount',
          ];
          const keyOf = row => `${row.frameworkId}|${row.databaseId}|${row.seed}|${row.strategyId}`;
          const baselineByKey = new Map(rows.baseline.map(row => [keyOf(row), row]));
          const watchByKey = new Map(rows.watch.map(row => [keyOf(row), row]));

          const riskierDifferences = [];
          for (const [key, baseline] of baselineByKey) {
            if (!riskier.has(baseline.strategyId)) continue;
            const watch = watchByKey.get(key);
            if (!watch) throw new Error(`watch missing riskier key ${key}`);
            const changed = Object.keys(baseline).filter(column => baseline[column] !== watch[column]);
            if (changed.length > 0) riskierDifferences.push({ key, changed });
          }
          if (riskierDifferences.length > 0) {
            throw new Error(`riskier rows changed: ${JSON.stringify(riskierDifferences.slice(0, 10))}`);
          }

          const mean = values => values.length === 0 ? 0 : values.reduce((sum, value) => sum + value, 0) / values.length;
          function summarize(selected) {
            const count = selected.length;
            const summary = {
              runs: count,
              wins: selected.filter(row => row.terminalStatus === 'WON').length,
              bankrupt: selected.filter(row => row.terminalStatus === 'BANKRUPT').length,
              timeout: selected.filter(row => row.terminalStatus === 'TIMEOUT').length,
            };
            summary.winRate = count === 0 ? 0 : summary.wins / count;
            summary.bankruptcyRate = count === 0 ? 0 : summary.bankrupt / count;
            summary.timeoutRate = count === 0 ? 0 : summary.timeout / count;
            for (const metric of numericMetrics) summary[metric] = mean(selected.map(row => Number(row[metric])));
            return summary;
          }

          function policySummary(policy) {
            const all = rows[policy];
            const byStrategy = {};
            for (const strategyId of strategyIds) {
              byStrategy[strategyId] = summarize(all.filter(row => row.strategyId === strategyId));
            }
            return {
              informed: summarize(all.filter(row => informed.has(row.strategyId))),
              riskier: summarize(all.filter(row => riskier.has(row.strategyId))),
              byStrategy,
            };
          }

          const baseline = policySummary('baseline');
          const watch = policySummary('watch');
          const transitions = {};
          for (const [key, before] of baselineByKey) {
            if (!informed.has(before.strategyId)) continue;
            const after = watchByKey.get(key);
            const transition = `${before.terminalStatus}->${after.terminalStatus}`;
            transitions[transition] = (transitions[transition] ?? 0) + 1;
          }

          const delta = {};
          for (const metric of ['winRate', 'bankruptcyRate', 'timeoutRate', ...numericMetrics]) {
            if (typeof baseline.informed[metric] === 'number' && typeof watch.informed[metric] === 'number') {
              delta[metric] = watch.informed[metric] - baseline.informed[metric];
            }
          }

          const byStrategyDelta = {};
          for (const strategyId of strategyIds) {
            byStrategyDelta[strategyId] = {};
            for (const metric of ['winRate', 'bankruptcyRate', 'timeoutRate', 'postReleaseOverloadDays', 'prematureCapacityActions', 'lowUtilizationExpandedNodeDays', 'infrastructureCostExposure', 'failureDays', 'overloadDays']) {
              byStrategyDelta[strategyId][metric] = watch.byStrategy[strategyId][metric] - baseline.byStrategy[strategyId][metric];
            }
          }

          const report = {
            rowCounts: { baseline: rows.baseline.length, watch: rows.watch.length },
            informedRunCounts: { baseline: baseline.informed.runs, watch: watch.informed.runs },
            riskierRowsIdentical: true,
            baseline,
            watch,
            informedDeltaWatchMinusBaseline: delta,
            byStrategyDeltaWatchMinusBaseline: byStrategyDelta,
            informedTerminalTransitions: transitions,
            diagnosticGate: {
              informedWinRateDidNotRegress: watch.informed.winRate >= baseline.informed.winRate,
              postReleaseOverloadImproved: watch.informed.postReleaseOverloadDays < baseline.informed.postReleaseOverloadDays,
              prematureCapacityDidNotIncrease: watch.informed.prematureCapacityActions <= baseline.informed.prematureCapacityActions,
              lowUtilizationDelta: watch.informed.lowUtilizationExpandedNodeDays - baseline.informed.lowUtilizationExpandedNodeDays,
              infrastructureExposureDelta: watch.informed.infrastructureCostExposure - baseline.informed.infrastructureCostExposure,
            },
          };
          fs.writeFileSync('full-matrix-summary.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: post-release-stability-full-matrix-summary
          path: full-matrix-summary.json
          if-no-files-found: error
