name: BP2 ALB Headroom Pilot

on:
  push:
    branches: [feature/balance-pass-2-release-readiness]

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [SPRING_BOOT, NESTJS, GIN, FASTAPI, ASPNET_CORE]
        database: [POSTGRESQL, MYSQL, MONGODB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch only ALB XLARGE headroom
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/core/infrastructure-sizing.ts')
          text = path.read_text()
          old = 'ALB: throughputProfiles([180, 360, 700, 1_800]'
          new = 'ALB: throughputProfiles([180, 360, 700, 2_250]'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one ALB profile match, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Run 10-seed six-strategy pilot
        shell: bash
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          mkdir -p pilot
          out="pilot/${FRAMEWORK}-${DATABASE}.csv"
          first=1
          for seed in 4 5 10 13 15 16 18 21 23 30; do
            npm run balance -- --framework "$FRAMEWORK" --db "$DATABASE" --seed "$seed" > /dev/null
            if [ "$first" -eq 1 ]; then
              cat artifacts/balance/runs.csv > "$out"
              first=0
            else
              tail -n +2 artifacts/balance/runs.csv >> "$out"
            fi
          done
      - name: Validate shard
        shell: bash
        env:
          FRAMEWORK: ${{ matrix.framework }}
          DATABASE: ${{ matrix.database }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = `pilot/${process.env.FRAMEWORK}-${process.env.DATABASE}.csv`;
          const lines = fs.readFileSync(file, 'utf8').trimEnd().split('\n');
          if (lines.length !== 61) throw new Error(`expected header + 60 rows, got ${lines.length}`);
          const header = lines[0].split(',');
          const f = header.indexOf('frameworkId');
          const d = header.indexOf('databaseId');
          const s = header.indexOf('seed');
          const st = header.indexOf('strategyId');
          const seen = new Set();
          for (const line of lines.slice(1)) {
            const c = line.split(',');
            if (c[f] !== process.env.FRAMEWORK || c[d] !== process.env.DATABASE) throw new Error('wrong stack row');
            seen.add(`${c[s]}:${c[st]}`);
          }
          if (seen.size !== 60) throw new Error(`expected 60 unique seed/strategy keys, got ${seen.size}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bp2-alb2250-${{ matrix.framework }}-${{ matrix.database }}
          path: pilot/*.csv
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bp2-alb2250-*
          path: all
          merge-multiple: true
      - name: Validate and summarize 900 rows
        shell: bash
        run: |
          node <<'NODE' | tee summary.json
          const fs = require('fs');
          const files = fs.readdirSync('all').filter(f => f.endsWith('.csv')).sort();
          const rows = [];
          let header = null;
          for (const file of files) {
            const lines = fs.readFileSync(`all/${file}`, 'utf8').trimEnd().split('\n');
            const h = lines[0].split(',');
            if (!header) header = h;
            for (const line of lines.slice(1)) {
              const c = line.split(',');
              rows.push(Object.fromEntries(header.map((key, i) => [key, c[i]])));
            }
          }
          if (rows.length !== 900) throw new Error(`expected 900 rows, got ${rows.length}`);
          const keys = new Set(rows.map(r => `${r.frameworkId}:${r.databaseId}:${r.seed}:${r.strategyId}`));
          if (keys.size !== 900) throw new Error(`expected 900 unique keys, got ${keys.size}`);
          const strategies = ['ORACLE','APM_AWARE','METRICS_AWARE','REACTIVE_BASIC','YOLO_SCALE','CHEAPSKATE'];
          const mean = (xs) => xs.reduce((a,b)=>a+b,0)/Math.max(1,xs.length);
          const summary = {};
          for (const strategy of strategies) {
            const rs = rows.filter(r => r.strategyId === strategy);
            summary[strategy] = {
              runs: rs.length,
              winRate: rs.filter(r => r.terminalStatus === 'WON').length / rs.length,
              bankruptcyRate: rs.filter(r => r.terminalStatus === 'BANKRUPT').length / rs.length,
              postReleaseOverloadDays: mean(rs.map(r => Number(r.postReleaseOverloadDays))),
              missingRequiredDependencyDays: mean(rs.map(r => Number(r.missingRequiredDependencyDays))),
              failureDays: mean(rs.map(r => Number(r.failureDays))),
              overloadDays: mean(rs.map(r => Number(r.overloadDays))),
              infrastructureCostExposure: mean(rs.map(r => Number(r.infrastructureCostExposure))),
              lowUtilizationExpandedNodeDays: mean(rs.map(r => Number(r.lowUtilizationExpandedNodeDays))),
            };
          }
          console.log(JSON.stringify({rowCount: rows.length, uniqueKeys: keys.size, summary}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bp2-alb2250-pilot-summary
          path: summary.json
